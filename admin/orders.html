<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMS — Admin</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"><style>body{padding:16px}.wrap{max-width:1100px;margin:auto}.list{display:grid;gap:14px;margin-top:16px}.item{padding:18px;border-radius:20px}.top{display:flex;justify-content:space-between;gap:10px}.id{color:#ffd34d;font-weight:900}.meta{color:#aaa;font-size:13px;line-height:1.7}.flow{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.flow button{padding:10px 12px;border-radius:11px;background:#111;color:#fff;border:1px solid #ffffff18}.flow button.active{border-color:#ffd34d;color:#ffd34d}.msg{margin-top:8px;color:#62ffb0}</style></head><body><main class="wrap"><section class="glass panel"><h1>📦 Order Management System</h1><p>Pending → Processing → Shipped → Delivered</p><div id="list">Loading...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>const ADMIN='mdrayhn3331@gmail.com',statuses=['pending','processing','shipped','delivered'];const el=document.getElementById('list');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function guard(){const{data:{user}}=await supabaseClient.auth.getUser();if(!user||user.email?.toLowerCase()!==ADMIN){location.replace('../index.html');return false}return true}async function load(){if(!await guard())return;const{data,error}=await supabaseClient.from('orders').select('*').order('created_at',{ascending:false});if(error){el.textContent=error.message;return}el.innerHTML=(data||[]).map(o=>{const s=String(o.status||o.delivery_status||'pending').toLowerCase();return `<article class="glass item"><div class="top"><b class="id">ORDER #${esc(String(o.id).slice(0,12))}</b><span>${o.created_at?new Date(o.created_at).toLocaleString('en-BD'):'—'}</span></div><div class="meta">👤 User: ${esc(o.user_id)}<br>📦 Item: ${esc(o.item_name||o.product_name||o.title||'Order')}<br>💳 Payment: ${esc(o.payment_status||'Pending')}<br>🚚 Delivery: ${esc(o.delivery_status||s)}</div><div class="flow">${statuses.map(x=>`<button class="${s===x?'active':''}" onclick="setStatus('${esc(o.id)}','${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><div id="m${esc(o.id)}" class="msg"></div></article>`}).join('')||'<p>No orders.</p>'}async function setStatus(id,status){const{error}=await supabaseClient.from('orders').update({status,delivery_status:status}).eq('id',id);const m=document.getElementById('m'+id);if(error){m.textContent='❌ '+error.message;return}m.textContent='✅ Status updated: '+status;load()}load()</script></body></html>
