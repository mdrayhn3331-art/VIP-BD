<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KYC Review — Admin</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"><style>body{padding:16px}.wrap{max-width:1100px;margin:auto}.list{display:grid;gap:14px;margin-top:16px}.item{padding:18px;border-radius:20px}.meta{color:#aaa;line-height:1.8}.doc{max-width:100%;max-height:360px;border-radius:14px;margin-top:12px}.actions{display:flex;gap:8px;margin-top:14px}.actions button{padding:11px 15px;border-radius:11px;background:#111;color:#fff;border:1px solid #ffffff20}.ok{border-color:#35d68b!important}.no{border-color:#ff4d6d!important}</style></head><body><main class="wrap"><section class="glass panel"><h1>🪪 KYC & User Verification</h1><p>Review submitted KYC documents and approve or reject verification requests.</p><div id="list">Loading...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>const ADMIN='mdrayhn3331@gmail.com',el=document.getElementById('list');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function guard(){const{data:{user}}=await supabaseClient.auth.getUser();if(!user||user.email?.toLowerCase()!==ADMIN){location.replace('../index.html');return false}return true}async function load(){if(!await guard())return;const{data,error}=await supabaseClient.from('profiles').select('*').order('created_at',{ascending:false});if(error){el.textContent=error.message;return}el.innerHTML=(data||[]).filter(p=>String(p.kyc_status||'pending').toLowerCase()!=='verified').map(p=>{const doc=p.kyc_document_url||p.kyc_doc_url||p.document_url;return `<article class="glass item"><h2>${esc(p.full_name||p.name||'User')}</h2><div class="meta">👤 User ID: ${esc(p.id)}<br>📧 Email: ${esc(p.email||'—')}<br>📱 Phone: ${esc(p.phone||'—')}<br>📌 KYC Status: ${esc(p.kyc_status||'Pending')}</div>${doc?`<p><a href="${esc(doc)}" target="_blank" rel="noopener">📄 Open KYC Document</a></p>${/^data:image\//.test(doc)?`<img class="doc" src="${esc(doc)}" alt="KYC document">`:''}`:'<p>⚠️ No KYC document URL found.</p>'}<div class="actions"><button class="ok" onclick="review('${esc(p.id)}','verified')">✅ Verify</button><button class="no" onclick="review('${esc(p.id)}','rejected')">❌ Reject</button></div></article>`}).join('')||'<div class="glass item">No pending KYC requests.</div>'}async function review(id,status){if(!confirm(status==='verified'?'Verify this KYC account?':'Reject this KYC request?'))return;const{error}=await supabaseClient.from('profiles').update({kyc_status:status}).eq('id',id);if(error){alert(error.message);return}load()}load()</script></body></html>
