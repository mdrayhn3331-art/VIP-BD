<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>⚙️ Website Settings — VIP SHOP BD</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"></head><body><main><section class="glass panel"><h1>⚙️ Website Settings</h1><p>এখান থেকে পুরো website-এর button style, size, color এবং text color পরিবর্তন করা যাবে।</p><div class="grid"><div class="glass card"><h3>🎨 Button Color</h3><input id="buttonColor" type="color" value="#ff9d00"><p>Primary button background</p></div><div class="glass card"><h3>📝 Text Color</h3><input id="buttonTextColor" type="color" value="#1a0d00"><p>Button text color</p></div><div class="glass card"><h3>📏 Button Size</h3><select id="buttonSize"><option value="small">Small</option><option value="medium" selected>Medium</option><option value="large">Large</option></select></div><div class="glass card"><h3>🔘 Button Radius</h3><select id="buttonRadius"><option value="12px">12px</option><option value="20px">20px</option><option value="999px" selected>Pill</option></select></div></div><h2>👀 Preview</h2><button id="preview" class="btn">Sample Button</button><button class="btn" onclick="saveSettings()">💾 Save Website Settings</button><p id="msg"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>const defaults={color:'#ff9d00',text:'#1a0d00',size:'medium',radius:'999px'};const sizes={small:['10px','18px'],medium:['14px','25px'],large:['17px','34px']};function applyPreview(){const s=sizes[buttonSize.value];preview.style.background=buttonColor.value;preview.style.color=buttonTextColor.value;preview.style.padding=s[0]+' '+s[1];preview.style.borderRadius=buttonRadius.value}async function guard(){const{data:{user}}=await supabaseClient.auth.getUser();if(!user){location.href='../index.html';return}const{data:p}=await supabaseClient.from('profiles').select('role').eq('id',user.id).maybeSingle();if(p?.role!=='admin'){location.href='../home.html';return}const{data}=await supabaseClient.from('site_settings').select('value').eq('key','button_theme').maybeSingle();if(data?.value){buttonColor.value=data.value.color||defaults.color;buttonTextColor.value=data.value.text||defaults.text;buttonSize.value=data.value.size||defaults.size;buttonRadius.value=data.value.radius||defaults.radius}applyPreview()}async function saveSettings(){const value={color:buttonColor.value,text:buttonTextColor.value,size:buttonSize.value,radius:buttonRadius.value};const{error}=await supabaseClient.from('site_settings').upsert({key:'button_theme',value,updated_at:new Date().toISOString()},{onConflict:'key'});msg.textContent=error?'❌ Save failed: '+error.message:'✅ Website button settings saved.'}buttonColor.oninput=applyPreview;buttonTextColor.oninput=applyPreview;buttonSize.onchange=applyPreview;buttonRadius.onchange=applyPreview;guard()</script></body></html>
