<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Banner & Ads Manager</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"><style>body{padding:16px}.wrap{max-width:1100px;margin:auto}.list{display:grid;gap:12px;margin-top:16px}.slide{padding:16px;border-radius:20px}.grid{display:grid;grid-template-columns:100px 1fr 1fr auto;gap:9px;align-items:center}.grid input{width:100%;box-sizing:border-box;padding:10px;border-radius:10px;background:#111;color:#fff;border:1px solid #ffffff18}.preview{width:100px;height:60px;object-fit:cover;border-radius:10px;background:#111}.save{padding:10px 14px;border-radius:10px;background:#111;color:#fff;border:1px solid #ffd34d55}@media(max-width:750px){.grid{grid-template-columns:80px 1fr}.grid input:last-of-type,.save{grid-column:2}.preview{width:80px;height:55px}}</style></head><body><main class="wrap"><section class="glass panel"><h1>🎞️ Banner & Ads Manager</h1><p>Home carousel-এর 10টি slide-এর image এবং destination link manage করুন।</p><div id="list">Loading...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>const ADMIN='mdrayhn3331@gmail.com',el=document.getElementById('list');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function guard(){const{data:{user}}=await supabaseClient.auth.getUser();if(!user||user.email?.toLowerCase()!==ADMIN){location.replace('../index.html');return false}return true}async function load(){if(!await guard())return;const{data,error}=await supabaseClient.from('banners').select('*').order('position',{ascending:true}).limit(10);if(error){el.innerHTML='<p>❌ '+esc(error.message)+'</p><p>Supabase-এ <b>banners</b> table (position, image_url, link_url) তৈরি/ব্যবহার করুন।</p>';return}el.innerHTML=Array.from({length:10},(_,i)=>{const b=(data||[])[i]||{id:'',position:i+1,image_url:'',link_url:''};return `<article class="glass slide"><div class="grid"><img class="preview" src="${esc(b.image_url)}" alt="Slide ${i+1}"><b>Slide ${i+1}</b><input id="img${i}" value="${esc(b.image_url)}" placeholder="Image URL"><input id="link${i}" value="${esc(b.link_url)}" placeholder="Destination URL"><button class="save" onclick="save(${i},'${esc(b.id)}',${i+1})">💾 Save</button></div></article>`}).join('')}async function save(i,id,position){const image_url=document.getElementById('img'+i).value.trim(),link_url=document.getElementById('link'+i).value.trim();let r;if(id)r=await supabaseClient.from('banners').update({image_url,link_url,position}).eq('id',id);else r=await supabaseClient.from('banners').insert({image_url,link_url,position});if(r.error)alert(r.error.message);else{alert('Slide '+position+' saved');load()}}load()</script></body></html>
