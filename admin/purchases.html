<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Premium Payment Approval</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"><style>body{padding:16px}.wrap{max-width:1100px;margin:auto}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center}.list{display:grid;gap:14px;margin-top:16px}.item{padding:18px;border-radius:20px}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;color:#aaa}.proof{max-width:100%;max-height:320px;border-radius:14px;margin-top:12px}.actions{display:flex;gap:8px;margin-top:14px}.actions button{padding:11px 16px;border-radius:12px;border:1px solid #ffffff20;background:#111;color:#fff}.ok{border-color:#35d68b!important}.no{border-color:#ff4d6d!important}@media(max-width:600px){.meta{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="glass panel"><div class="toolbar"><div><h1>💳 Premium Payment Approval</h1><p>Review bKash/Nagad payment proof before granting Premium Access.</p></div><a class="btn" href="index.html">Admin Home</a></div><div id="purchases" class="list">Loading...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>const ADMIN='mdrayhn3331@gmail.com';const el=document.getElementById('purchases');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function guard(){const{data:{user}}=await supabaseClient.auth.getUser();if(!user||user.email?.toLowerCase()!==ADMIN){location.replace('../index.html');return false}return true}async function load(){if(!await guard())return;const{data,error}=await supabaseClient.from('premium_purchases').select('*').order('created_at',{ascending:false});if(error){el.textContent=error.message;return}el.innerHTML=(data||[]).map(p=>{const proof=p.payment_proof_url||p.proof_url;return `<article class="glass item"><h2>Request #${esc(p.id)}</h2><div class="meta"><div>👤 User: ${esc(p.user_id)}</div><div>💰 Amount: ৳${esc(p.amount)}</div><div>💳 Method: ${esc(p.payment_method||p.method||'bKash/Nagad')}</div><div>🧾 Transaction ID: ${esc(p.transaction_id||'-')}</div><div>📅 ${p.created_at?new Date(p.created_at).toLocaleString('en-BD'):'-'}</div><div>📌 Status: <b>${esc(p.status)}</b></div></div>${proof?`<a href="${esc(proof)}" target="_blank" rel="noopener"><img class="proof" src="${esc(proof)}" alt="Payment proof"></a>`:'<p>⚠️ No screenshot attached.</p>'}${String(p.status).toLowerCase()==='pending'?`<div class="actions"><button class="ok" onclick="review('${esc(p.id)}','approved')">✅ Approve & Grant Premium</button><button class="no" onclick="review('${esc(p.id)}','rejected')">❌ Reject</button></div>`:''}</article>`}).join('')||'<div class="glass item">No payment requests.</div>'}async function review(id,status){if(!confirm(status==='approved'?'Approve payment and grant Premium Access?':'Reject this payment proof?'))return;let{error}=await supabaseClient.from('premium_purchases').update({status}).eq('id',id);if(error){alert(error.message);return}alert(status==='approved'?'Approved. Premium activation can now be granted by the access workflow.':'Payment rejected.');load()}load()</script></body></html>
