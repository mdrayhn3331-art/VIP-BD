<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products CRUD</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"><style>body{padding:16px}.wrap{max-width:1100px;margin:auto}.form{padding:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid>*{box-sizing:border-box;width:100%;padding:11px;border-radius:10px;background:#111;color:#fff;border:1px solid #ffffff18}.wide{grid-column:1/-1}.upload{padding:12px!important}.list{display:grid;gap:12px;margin-top:16px}.item{padding:14px;border-radius:18px}.item img{width:80px;height:80px;object-fit:cover;border-radius:12px;float:left;margin-right:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;clear:both;padding-top:10px}.actions button{padding:9px 13px;border-radius:10px;background:#111;color:#fff;border:1px solid #ffffff18}.edit{border-color:#ffd34d55!important}.del{border-color:#ff4d6d55!important}@media(max-width:600px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="wrap"><section class="glass form"><h1>🛍️ Product Manager — CRUD</h1><p>Fashion categories এবং Premium Apps একই manager থেকে Add / Edit / Delete করুন।</p><form id="form"><input type="hidden" id="id"><div class="grid"><input id="name" placeholder="Product / App name" required><input id="price" type="number" min="0" step="0.01" placeholder="Price (BDT)" required><select id="category" required><option value="">Category</option><option value="saree">Saree</option><option value="three-piece">3-Piece</option><option value="clothes">General Clothes</option><option value="pants">Pants</option><option value="shirt">Shirts</option><option value="tshirt">T-Shirts</option><option value="eyewear">Eyewear & Glasses</option><option value="premium-app">Premium App</option><option value="digital-product">Digital Product</option></select><input id="discount" type="number" min="0" max="100" placeholder="Discount %"><input id="rating" type="number" min="0" max="5" step="0.1" placeholder="Rating"><input id="image_url" class="wide" placeholder="Image URL (optional)"><textarea id="description" class="wide" placeholder="Description"></textarea></div><div class="upload"><input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp"><small>Image দিলে Supabase product-images storage-এ upload হবে।</small></div><button class="btn" type="submit" id="save">➕ Add Product</button> <button class="btn" type="button" onclick="resetForm()">Clear</button><p id="msg"></p></form></section><section class="glass form"><h2>Existing Products</h2><div id="list" class="list">Loading...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>const ADMIN='mdrayhn3331@gmail.com';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function guard(){const{data:{user}}=await supabaseClient.auth.getUser();if(!user||user.email?.toLowerCase()!==ADMIN){location.replace('../index.html');return false}return true}async function load(){if(!await guard())return;const{data,error}=await supabaseClient.from('products').select('*').order('created_at',{ascending:false});if(error){$('list').textContent=error.message;return}$('list').innerHTML=(data||[]).map(p=>`<article class="glass item"><img src="${esc(p.image_url||'')}" alt=""><b>${esc(p.name)}</b><p>${esc(p.category)} · ৳${esc(p.price)} · ⭐${esc(p.rating??'—')} · -${esc(p.discount??0)}%</p><p>${esc(p.description||'')}</p><div class="actions"><button class="edit" onclick="edit('${esc(p.id)}')">✏️ Edit</button><button class="del" onclick="removeProduct('${esc(p.id)}')">🗑️ Delete</button></div></article>`).join('')||'No products.'}async function edit(id){const{data,error}=await supabaseClient.from('products').select('*').eq('id',id).single();if(error){alert(error.message);return}['id','name','price','category','discount','rating','image_url','description'].forEach(k=>{if($(k))$(k).value=data[k]??''});$('save').textContent='💾 Update Product';window.scrollTo({top:0,behavior:'smooth'})}async function removeProduct(id){if(!confirm('Delete this product?'))return;const{error}=await supabaseClient.from('products').delete().eq('id',id);if(error)alert(error.message);else load()}function resetForm(){$('form').reset();$('id').value='';$('save').textContent='➕ Add Product';$('msg').textContent=''}$('form').onsubmit=async e=>{e.preventDefault();if(!await guard())return;const msg=$('msg'),file=$('imageFile').files[0];let image=$('image_url').value.trim();if(file){if(file.size>5*1024*1024){msg.textContent='Image সর্বোচ্চ 5MB হতে হবে।';return}const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=`admin/${crypto.randomUUID()}.${ext}`;const up=await supabaseClient.storage.from('product-images').upload(path,file,{contentType:file.type,upsert:false});if(up.error){msg.textContent='Upload failed: '+up.error.message;return}image=supabaseClient.storage.from('product-images').getPublicUrl(path).data.publicUrl}const payload={name:$('name').value.trim(),price:Number($('price').value),category:$('category').value,discount:Number($('discount').value||0),rating:Number($('rating').value||0),image_url:image,description:$('description').value.trim(),is_active:true};const id=$('id').value;const r=id?await supabaseClient.from('products').update(payload).eq('id',id):await supabaseClient.from('products').insert(payload);if(r.error){msg.textContent=r.error.message;return}msg.textContent=id?'✅ Product updated.':'✅ Product added.';resetForm();load()};load()</script></body></html>
