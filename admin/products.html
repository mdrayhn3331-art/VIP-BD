<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"><style>.upload{border:1px dashed #ffffff44;border-radius:18px;padding:14px;margin:10px 0}.preview{max-width:160px;max-height:120px;border-radius:14px;display:none;margin-top:10px}.hint{opacity:.7;font-size:13px}</style></head><body><main><section class="glass panel"><h1>📦 Product Management</h1><form id="productForm"><input name="name" placeholder="Product name" required><input name="price" type="number" min="0" step="0.01" placeholder="Price (BDT)" required><select name="category" required><option value="">Select category</option><option value="smartphone">📱 Smartphone</option><option value="lifestyle">🛍️ Lifestyle</option><option value="shoes">👟 Shoes</option><option value="fashion">👕 Fashion</option></select><div class="upload"><label>🖼️ Product Image</label><input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp" required><div class="hint">ফোনের Gallery থেকে সরাসরি ছবি নির্বাচন করুন। কোনো image link লাগবে না।</div><img id="preview" class="preview" alt="Preview"></div><textarea name="description" placeholder="Description"></textarea><button class="btn" type="submit">➕ Add Product</button><p id="msg" class="hint"></p></form><div id="adminProducts"></div></section></main><script src="../js/supabase.js"></script><script src="../js/admin.js"></script><script>const fileInput=document.getElementById('imageFile'),preview=document.getElementById('preview');fileInput.addEventListener('change',()=>{const f=fileInput.files[0];if(!f){preview.style.display='none';return}preview.src=URL.createObjectURL(f);preview.style.display='block'});</script></body></html>
