<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSM SHOP</title><link rel="stylesheet" href="css/style.css"></head><body><section id="loader" class="rsm-loader"><div class="loader-orbit"><div class="orbit orbit-a"></div><div class="orbit orbit-b"></div><div class="orbit orbit-c"></div><div class="rsm-core"><span class="r">R</span><span class="s">S</span><span class="m">M</span></div></div><div class="loader-name">RSM SHOP</div><div class="progress"><i></i></div><div class="loading-text">LOADING <b id="percent">0%</b></div></section><main id="app" class="center" style="display:none"><section class="glass hero"><div class="tag">RSM SHOP</div><h1>Welcome</h1><p class="muted">Premium shopping & digital marketplace</p><form id="loginForm"><input id="identifier" placeholder="Email or mobile number" required><div class="pass"><input id="password" type="password" placeholder="Password" required><button type="button" class="eye" onclick="togglePassword('password',this)">👁️</button></div><button class="btn" type="submit">3D LOGIN</button></form><a class="btn alt" href="register.html">REGISTRATION</a><p><a href="#" onclick="forgotPassword();return false">Forgot Password?</a></p><div class="social"><button class="btn" type="button" onclick="googleLogin()">G&nbsp; Continue with Google</button><button class="btn" type="button">f&nbsp; Continue with Facebook</button></div><p id="msg"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script>let n=0;const pct=document.getElementById('percent');const timer=setInterval(()=>{n=Math.min(100,n+2);pct.textContent=n+'%';if(n>=100){clearInterval(timer);setTimeout(()=>{loader.style.display='none';app.style.display='grid'},350)}},55)</script><style>body{background:#030304}.rsm-loader{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}.loader-orbit{position:relative;width:330px;height:330px;display:grid;place-items:center;filter:drop-shadow(0 0 25px rgba(255,210,70,.35))}.rsm-core{width:220px;height:220px;border-radius:50%;display:flex;align-items:center;justify-content:center;gap:4px;background:radial-gradient(circle at 35% 25%,#252525,#080808 68%);border:3px solid #d7af37;box-shadow:inset 0 0 35px #000,0 0 20px #d7af37,0 0 70px rgba(215,175,55,.5);font-size:70px;font-weight:1000;letter-spacing:3px;z-index:3;animation:corePulse 2s ease-in-out infinite}.r{color:#ff315f;text-shadow:0 0 20px #ff315f}.s{color:#24d9ff;text-shadow:0 0 20px #24d9ff}.m{color:#b86cff;text-shadow:0 0 20px #b86cff}.orbit{position:absolute;border-radius:50%;border:2px solid transparent;z-index:1}.orbit-a{inset:5px;border-top-color:#ffd34d;border-right-color:#ffd34d;animation:spin 2.5s linear infinite}.orbit-b{inset:25px;border-bottom-color:#24d9ff;border-left-color:#24d9ff;animation:spinReverse 3s linear infinite}.orbit-c{inset:43px;border-top-color:#b86cff;border-left-color:#b86cff;animation:spin 4s linear infinite}.loader-name{margin-top:18px;font-size:24px;font-weight:900;letter-spacing:7px;text-shadow:0 0 15px #d7af37}.progress{width:300px;height:9px;margin-top:24px;background:#151515;border:1px solid #333;border-radius:20px;overflow:hidden;box-shadow:0 0 15px #000}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff315f,#24d9ff,#b86cff,#ffd34d);animation:load 3s linear forwards}.loading-text{margin-top:10px;color:#aaa;font-size:12px;letter-spacing:3px}@keyframes load{to{width:100%}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinReverse{to{transform:rotate(-360deg)}}@keyframes corePulse{50%{transform:scale(1.045);box-shadow:inset 0 0 35px #000,0 0 35px #d7af37,0 0 95px rgba(215,175,55,.6)}}@media(max-width:420px){.loader-orbit{width:290px;height:290px}.rsm-core{width:195px;height:195px;font-size:62px}.progress{width:260px}}</style></body></html>
