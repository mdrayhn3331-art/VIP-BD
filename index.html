<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSM SHOP</title><link rel="stylesheet" href="css/style.css"></head><body><section id="loader" class="center"><div class="glass hero"><div class="logo rsm-logo"><span>R</span><span>S</span><span>M</span></div><div class="tag">RSM SHOP</div><div class="progress"><i></i></div></div></section><main id="app" class="center" style="display:none"><section class="glass hero"><div class="tag">RSM SHOP</div><h1>Welcome</h1><p class="muted">Premium shopping & digital marketplace</p><form id="loginForm"><input id="identifier" placeholder="Email or mobile number" required><div class="pass"><input id="password" type="password" placeholder="Password" required><button type="button" class="eye" onclick="togglePassword('password',this)">👁️</button></div><button class="btn" type="submit">3D LOGIN</button></form><a class="btn alt" href="register.html">REGISTRATION</a><p><a href="#" onclick="forgotPassword();return false">Forgot Password?</a></p><div class="social"><button class="btn" type="button" onclick="googleLogin()">G&nbsp; Continue with Google</button><button class="btn" type="button">f&nbsp; Continue with Facebook</button></div><p id="msg"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script>setTimeout(()=>{loader.style.display='none';app.style.display='grid'},3000);</script><style>.rsm-logo{font-size:52px;font-weight:900;letter-spacing:5px}.rsm-logo span:nth-child(1){color:#ff4d6d}.rsm-logo span:nth-child(2){color:#35d7ff}.rsm-logo span:nth-child(3){color:#b56cff}.progress{height:8px;background:#222;border-radius:20px;overflow:hidden;margin:25px auto 0;max-width:280px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd34d,#fff,#ffd34d);animation:load 3s forwards}@keyframes load{to{width:100%}}.social{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}</style></body></html>
