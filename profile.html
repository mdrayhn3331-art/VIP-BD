<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Profile — VIP SHOP BD</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/3d.css"></head><body><header class="nav glass"><b>👤 VIP SHOP BD</b><a href="home.html">🏠 Home</a></header><main><section class="glass hero"><div class="logo">👤</div><h1>My Profile</h1><p id="email">লোড হচ্ছে...</p><div id="msg" class="muted"></div></section><section class="glass panel"><div class="profile-head"><div class="avatar-wrap"><img id="avatar" src="https://ui-avatars.com/api/?name=VIP+User&background=ff9d00&color=111" alt="Profile"><label class="btn upload">🖼️ Profile Picture<input id="avatarFile" type="file" accept="image/*" hidden></label></div><div><h2 id="name">Member</h2><p id="phone">Mobile: —</p><p id="kycStatus">🪪 KYC: Not Verified</p></div></div></section><section class="grid"><button class="glass card action" onclick="deposit()"><h2>💰 Deposit</h2><p>bKash / Nagad deposit request</p></button><button class="glass card action" onclick="showBalance()"><h2>💳 Balance</h2><p id="balance">৳0</p></button><button class="glass card action" onclick="editProfile()"><h2>✏️ Edit Profile</h2><p>নাম ও mobile update</p></button><button class="glass card action" onclick="changePassword()"><h2>🔐 Password</h2><p>Password change</p></button><a class="glass card action" href="orders.html"><h2>📋 History</h2><p>Orders & transactions</p></a><a class="glass card action" href="orders.html#cart"><h2>🛒 Cart</h2><p>আপনার shopping cart</p></a><button class="glass card action" onclick="kyc()"><h2>🪪 KYC Verify</h2><p>Verification request</p></button><button class="glass card action" onclick="adminGuide()"><h2>👨‍💼 Admin Guide</h2><p>সহায়তা ও নিয়ম</p></button></section><button class="btn" onclick="logout()">🚪 Logout</button></main><nav class="mobile-nav glass"><a href="home.html">🏠<small>হোম</small></a><a href="vip.html">🛍️<small>প্রোডাক্ট</small></a><a href="profile.html" class="active">👤<small>প্রোফাইল</small></a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script>let user=null,profile=null;async function init(){const r=await supabaseClient.auth.getUser();user=r.data.user;if(!user){location.href='index.html';return}const p=await supabaseClient.from('profiles').select('*').eq('id',user.id).single();profile=p.data||{};document.getElementById('email').textContent=profile.email||user.email||'';document.getElementById('name').textContent=profile.full_name||'Member';document.getElementById('phone').textContent='Mobile: '+(profile.phone||'—');document.getElementById('kycStatus').textContent='🪪 KYC: '+(profile.kyc_status||'Not Verified');const w=await supabaseClient.from('wallets').select('balance').eq('user_id',user.id).maybeSingle();document.getElementById('balance').textContent='৳'+Number(w.data?.balance||0).toLocaleString('en-BD');if(profile.avatar_url)document.getElementById('avatar').src=profile.avatar_url}async function editProfile(){const name=prompt('Full Name',profile.full_name||'');if(name===null)return;const phone=prompt('Mobile Number',profile.phone||'');if(phone===null)return;const{error}=await supabaseClient.from('profiles').update({full_name:name.trim(),phone:phone.trim()}).eq('id',user.id);document.getElementById('msg').textContent=error?'Update failed: '+error.message:'Profile updated successfully';init()}async function changePassword(){const p=prompt('নতুন Password (কমপক্ষে 6 অক্ষর)');if(!p)return;if(p.length<6)return document.getElementById('msg').textContent='Password কমপক্ষে 6 অক্ষর হতে হবে।';const{error}=await supabaseClient.auth.updateUser({password:p});document.getElementById('msg').textContent=error?'Password change failed: '+error.message:'Password changed successfully'}function showBalance(){alert('Current Wallet Balance: '+document.getElementById('balance').textContent)}function deposit(){location.href='home.html#deposit'}function kyc(){alert('KYC verification form শিগগিরই সম্পূর্ণ করা হবে।')}function adminGuide(){alert('Admin Guide: Deposit approval, VIP approval ও support-এর জন্য Admin-এর নির্দেশনা অনুসরণ করুন।')}document.getElementById('avatarFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f||!user)return;const ext=f.name.split('.').pop().toLowerCase();const path=user.id+'/avatar.'+ext;const up=await supabaseClient.storage.from('avatars').upload(path,f,{upsert:true,contentType:f.type});if(up.error){document.getElementById('msg').textContent='Image upload failed: '+up.error.message;return}const{data}=supabaseClient.storage.from('avatars').getPublicUrl(path);await supabaseClient.from('profiles').update({avatar_url:data.publicUrl}).eq('id',user.id);document.getElementById('avatar').src=data.publicUrl;document.getElementById('msg').textContent='Profile picture updated.'});init()</script></body></html>
