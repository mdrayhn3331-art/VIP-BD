<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register — VIP SHOP BD</title><link rel="stylesheet" href="css/style.css"></head><body><main class="center"><section class="glass hero"><div class="logo">💎</div><div class="tag">VIP SHOP BD</div><h1>রেজিস্ট্রেশন</h1><form id="registerForm"><input id="fullName" placeholder="পূর্ণ নাম" required><input id="phone" placeholder="মোবাইল নম্বর" inputmode="tel" required><input id="email" type="email" placeholder="ইমেইল" required><div class="pass"><input id="regPassword" type="password" placeholder="পাসওয়ার্ড" minlength="6" required><button type="button" class="eye" onclick="togglePassword('regPassword',this)">👁️</button></div><div class="pass"><input id="confirmPassword" type="password" placeholder="পাসওয়ার্ড নিশ্চিত করুন" minlength="6" required><button type="button" class="eye" onclick="togglePassword('confirmPassword',this)">👁️</button></div><input id="referralCode" placeholder="Referral / Invitation Code (ঐচ্ছিক)"><button class="btn" type="submit">3D REGISTER</button></form><p><a href="index.html">লগইন পেজে ফিরুন</a></p><p id="msg"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script></body></html>
