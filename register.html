<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration — RSM SHOP</title><link rel="stylesheet" href="css/style.css"></head><body><main class="center"><section class="glass hero"><div class="logo rsm-logo"><span>R</span><span>S</span><span>M</span></div><div class="tag">RSM SHOP</div><h1>Registration</h1><form id="registerForm"><div style="display:flex;gap:8px"><input id="firstName" placeholder="First Name" required><input id="lastName" placeholder="Last Name" required></div><input id="phone" placeholder="Phone Number" inputmode="tel" required><input id="email" type="email" placeholder="Email" required><div class="pass"><input id="regPassword" type="password" placeholder="Strong Password" minlength="8" required><button type="button" class="eye" onclick="togglePassword('regPassword',this)">👁️</button></div><div class="pass"><input id="confirmPassword" type="password" placeholder="Confirm Password" minlength="8" required><button type="button" class="eye" onclick="togglePassword('confirmPassword',this)">👁️</button></div><button class="btn" type="submit">3D REGISTER</button></form><div class="social"><button class="btn" type="button" onclick="googleLogin()">G&nbsp; Google Sign-In</button><button class="btn" type="button">f&nbsp; Facebook Sign-In</button></div><p><a href="index.html">Back to Login</a></p><p id="msg"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><style>.rsm-logo{font-size:48px;font-weight:900;letter-spacing:5px}.rsm-logo span:nth-child(1){color:#ff4d6d}.rsm-logo span:nth-child(2){color:#35d7ff}.rsm-logo span:nth-child(3){color:#b56cff}.social{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}</style></body></html>
