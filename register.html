<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSM SHOP — Join</title><link rel="stylesheet" href="css/style.css"></head><body><main class="auth-shell"><section class="auth-card glass"><div class="auth-brand"><div class="logo rsm-logo"><span>R</span><span>S</span><span>M</span></div><div><b>RSM SHOP</b><small>Premium account</small></div></div><div class="auth-tabs"><a href="index.html">LOGIN</a><a class="active" href="register.html">REGISTER</a><a href="forgot.html">FORGOT</a></div><h1>Create your account</h1><p class="muted">Join RSM SHOP with a secure premium account.</p><form id="registerForm"><div class="form-grid"><input id="firstName" placeholder="First Name" autocomplete="given-name" required><input id="lastName" placeholder="Last Name" autocomplete="family-name" required></div><input id="phone" placeholder="Phone Number" inputmode="tel" autocomplete="tel" required><input id="email" type="email" placeholder="Email" autocomplete="email" required><div class="pass"><input id="regPassword" type="password" placeholder="Strong Password" minlength="8" autocomplete="new-password" required><button type="button" class="eye" onclick="togglePassword('regPassword',this)">👁️</button></div><button type="button" class="btn alt" id="generatePassword">✨ Generate Strong Password</button><div class="pass"><input id="confirmPassword" type="password" placeholder="Confirm Password" minlength="8" autocomplete="new-password" required><button type="button" class="eye" onclick="togglePassword('confirmPassword',this)">👁️</button></div><button class="btn premium" type="submit">CREATE ACCOUNT ✦</button></form><div class="divider"><span>OR CONTINUE WITH</span></div><div class="social"><button class="btn google" type="button" onclick="googleLogin()"><span class="google-mark">G</span> Google</button><button class="btn facebook" type="button" onclick="facebookLogin()"><span>f</span> Facebook</button></div><p class="small">Already have an account? <a href="index.html">Login</a></p><p id="msg"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script>const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*';function makePassword(){let a='';for(let i=0;i<14;i++)a+=chars[Math.floor(Math.random()*chars.length)];return a}document.getElementById('generatePassword').onclick=()=>{const p=makePassword();document.getElementById('regPassword').value=p;document.getElementById('confirmPassword').value=p;document.getElementById('regPassword').type='text';document.getElementById('confirmPassword').type='text';showMsg('Strong password generated. Save it somewhere safe.');};</script><style>body{background:#030304}.auth-shell{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(520px,100%);padding:24px;border:1px solid rgba(215,175,55,.28);box-shadow:0 25px 80px rgba(0,0,0,.55)}.auth-brand{display:flex;align-items:center;gap:12px}.auth-brand small{display:block;color:#999;margin-top:3px}.rsm-logo{font-size:34px;font-weight:1000;letter-spacing:4px}.rsm-logo span:nth-child(1){color:#ff315f;text-shadow:0 0 16px #ff315f}.rsm-logo span:nth-child(2){color:#24d9ff;text-shadow:0 0 16px #24d9ff}.rsm-logo span:nth-child(3){color:#b86cff;text-shadow:0 0 16px #b86cff}.auth-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:24px 0}.auth-tabs a{text-align:center;padding:11px;border:1px solid #292929;border-radius:12px;color:#aaa;text-decoration:none;background:#0b0b0b}.auth-tabs a.active,.auth-tabs a:hover{color:#fff;border-color:#d7af37;box-shadow:0 0 18px rgba(215,175,55,.18)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.auth-card form input{width:100%;box-sizing:border-box;margin:6px 0}.auth-card .btn{width:100%;margin:6px 0}.divider{text-align:center;color:#777;font-size:11px;letter-spacing:2px;margin:18px 0}.social{display:grid;grid-template-columns:1fr 1fr;gap:10px}.google-mark{font-weight:900}.facebook span{font-size:20px;font-weight:900}.small{font-size:13px;text-align:center}.muted{color:#999}@media(max-width:480px){.form-grid,.social{grid-template-columns:1fr}.auth-card{padding:18px}}</style></body></html>
