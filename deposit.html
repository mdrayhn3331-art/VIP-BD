<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deposit</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/3d.css"></head><body><main><section class="glass panel"><h1>💳 Deposit</h1><div class="paygrid"><button type="button" class="pay bkash" onclick="choose('bKash','01876872469')">📱<strong>bKash</strong><small>01876872469</small></button><button type="button" class="pay nagad" onclick="choose('Nagad','01876872469')">📲<strong>Nagad</strong><small>01876872469</small></button><button type="button" class="pay cardpay" onclick="choose('Card','')">💳<strong>Card Payment</strong><small>Visa / Mastercard</small></button></div><div id="selected" class="selected glass" hidden></div><form id="depositForm" hidden><input id="method" type="hidden"><label>Amount (BDT)</label><input id="amount" type="number" min="1" step="1" placeholder="যেমন 500" required><div id="senderBox"><label>আপনার bKash/Nagad Number</label><input id="sender" inputmode="numeric" placeholder="01XXXXXXXXX"></div><div id="trxBox"><label>Transaction ID</label><input id="trx" placeholder="Transaction ID দিন"></div><div id="cardInfo" class="muted" hidden>Card payment-এর জন্য secure payment gateway ব্যবহার করুন। Card number/CVV এই website-এ store করা হবে না।</div><label>Note (optional)</label><textarea id="note" rows="3" placeholder="অতিরিক্ত তথ্য"></textarea><button class="btn" type="submit">✅ Submit Deposit Request</button><p id="msg" class="muted"></p></form></section><section class="glass panel"><h2>📋 My Deposit History</h2><div id="history">লোড হচ্ছে...</div></section></main><nav class="mobile-nav glass"><a href="home.html">🏠<small>Home</small></a><a href="orders.html">🛍️<small>Products</small></a><a href="balance.html">💳<small>Balance</small></a><a href="orders.html#history">📋<small>Orders</small></a><a href="profile.html">👤<small>Profile</small></a></nav><style>.paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:20px 0}.pay{min-height:145px;border:1px solid #ffffff33;border-radius:24px;color:#fff;cursor:pointer;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;position:relative;overflow:hidden;box-shadow:0 10px 0 #0008,0 0 30px #ff9d0040,inset 0 1px #fff8;transition:.18s}.pay strong{font-size:1.2rem}.pay small{opacity:.9}.pay:hover{transform:translateY(-6px);box-shadow:0 16px 0 #0008,0 0 48px #ffbd3270,inset 0 1px #fff}.pay:active{transform:translateY(6px);box-shadow:0 3px 0 #0008,0 0 25px #ff9d0055}.pay:after{content:"";position:absolute;left:-70%;top:-30%;width:40%;height:170%;background:linear-gradient(90deg,transparent,#ffffffaa,transparent);transform:skewX(-20deg);animation:shine 3s infinite}.bkash{background:linear-gradient(145deg,#e2136e,#8c073f)}.nagad{background:linear-gradient(145deg,#f58220,#963b00)}.cardpay{background:linear-gradient(145deg,#465bc5,#121947)}.selected{padding:15px;border-color:#ffbd32;color:#ffd34d;margin:12px 0}@keyframes shine{0%,55%{left:-70%;opacity:0}70%{opacity:1}90%,100%{left:130%;opacity:0}}@media(max-width:700px){.paygrid{grid-template-columns:1fr}.pay{min-height:115px;flex-direction:row;gap:12px}.pay strong{font-size:1.1rem}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script>let user;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function init(){const r=await supabaseClient.auth.getUser();user=r.data.user;if(!user){location.href='index.html';return}loadHistory()}function choose(method,number){$('method').value=method;$('depositForm').hidden=false;$('selected').hidden=false;$('selected').innerHTML=`<b>Selected: ${method}</b>${number?`<br>Send to: <strong>${number}</strong>`:'<br>Secure Card Payment'}`;const card=method==='Card';$('senderBox').hidden=card;$('trxBox').hidden=card;$('cardInfo').hidden=!card;$('sender').required=!card;$('trx').required=!card}async function loadHistory(){const{data,error}=await supabaseClient.from('deposits').select('amount,method,sender_number,transaction_id,status,created_at').eq('user_id',user.id).order('created_at',{ascending:false}).limit(20);if(error){$('history').textContent=error.message;return}$('history').innerHTML=(data||[]).map(d=>`<article class="glass card"><b>${esc(d.method)} • ৳${Number(d.amount).toLocaleString('en-BD')}</b><p>TrxID: ${esc(d.transaction_id||'—')}</p><p>Status: <b>${esc(d.status||'pending')}</b></p><small>${new Date(d.created_at).toLocaleString('bn-BD')}</small></article>`).join('')||'কোনো deposit request নেই।'}$('depositForm').addEventListener('submit',async e=>{e.preventDefault();$('msg').textContent='Submitting...';const method=$('method').value;const amount=Number($('amount').value);if(amount<=0)return $('msg').textContent='সঠিক amount দিন।';const sender=$('sender').value.replace(/\s+/g,'');if(!method)return $('msg').textContent='Payment method নির্বাচন করুন।';if(method!=='Card'&&!/^01\d{9}$/.test(sender))return $('msg').textContent='সঠিক বাংলাদেশি mobile number দিন।';const{error}=await supabaseClient.from('deposits').insert({user_id:user.id,amount,method,sender_number:sender||null,transaction_id:$('trx').value.trim()||null,note:$('note').value.trim()||null,status:'pending'});if(error){$('msg').textContent='❌ Request failed: '+error.message;return}$('msg').textContent='✅ Deposit request submitted. Admin approval-এর অপেক্ষায় আছে।';e.target.reset();$('depositForm').hidden=true;$('selected').hidden=true;loadHistory()});init()</script></body></html>
