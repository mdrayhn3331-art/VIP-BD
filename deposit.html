<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deposit — VIP SHOP BD</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/3d.css"></head><body><header class="nav glass"><b>💰 VIP SHOP BD</b><a href="profile.html">👤 Profile</a></header><main><section class="glass hero"><div class="tag">💳 WALLET DEPOSIT</div><h1>Deposit</h1><p>Deposit request পাঠান। Admin approve করলে আপনার wallet balance-এ টাকা যোগ হবে।</p><div class="price">৳<span id="balance">0</span></div></section><section class="glass panel"><h2>📲 Deposit Request</h2><form id="depositForm"><label>Payment Method</label><select id="method" required><option value="">Select</option><option value="bKash">bKash</option><option value="Nagad">Nagad</option></select><label>Amount (BDT)</label><input id="amount" type="number" min="1" step="1" placeholder="যেমন 500" required><label>আপনার bKash/Nagad Number</label><input id="sender" inputmode="numeric" placeholder="01XXXXXXXXX" required><label>Transaction ID</label><input id="trx" placeholder="Transaction ID দিন" required><label>Note (optional)</label><textarea id="note" rows="3" placeholder="অতিরিক্ত তথ্য"></textarea><button class="btn" type="submit">💳 Submit Deposit Request</button><p id="msg" class="muted"></p></form></section><section class="glass panel"><h2>📋 My Deposit History</h2><div id="history">লোড হচ্ছে...</div></section></main><nav class="mobile-nav glass"><a href="home.html">🏠<small>হোম</small></a><a href="vip.html">🛍️<small>প্রোডাক্ট</small></a><a href="profile.html" class="active">👤<small>প্রোফাইল</small></a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script>let user;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function init(){const r=await supabaseClient.auth.getUser();user=r.data.user;if(!user){location.href='index.html';return}const w=await supabaseClient.from('wallets').select('balance').eq('user_id',user.id).maybeSingle();$('balance').textContent=Number(w.data?.balance||0).toLocaleString('en-BD');loadHistory()}async function loadHistory(){const{data,error}=await supabaseClient.from('deposits').select('amount,method,sender_number,transaction_id,status,created_at').eq('user_id',user.id).order('created_at',{ascending:false}).limit(20);if(error){$('history').textContent=error.message;return}$('history').innerHTML=(data||[]).map(d=>`<article class="glass card"><b>${esc(d.method)} • ৳${Number(d.amount).toLocaleString('en-BD')}</b><p>TrxID: ${esc(d.transaction_id)}</p><p>Status: <b>${esc(d.status||'pending')}</b></p><small>${new Date(d.created_at).toLocaleString('bn-BD')}</small></article>`).join('')||'কোনো deposit request নেই।'}$('depositForm').addEventListener('submit',async e=>{e.preventDefault();$('msg').textContent='Submitting...';const amount=Number($('amount').value);if(amount<=0)return $('msg').textContent='সঠিক amount দিন।';const sender=$('sender').value.replace(/\s+/g,'');if(!/^01\d{9}$/.test(sender))return $('msg').textContent='সঠিক বাংলাদেশি mobile number দিন।';const{error}=await supabaseClient.from('deposits').insert({user_id:user.id,amount,method:$('method').value,sender_number:sender,transaction_id:$('trx').value.trim(),note:$('note').value.trim()||null,status:'pending'});if(error){$('msg').textContent='❌ Request failed: '+error.message;return}$('msg').textContent='✅ Deposit request submitted. Admin approval-এর অপেক্ষায় আছে।';e.target.reset();loadHistory()});init()</script></body></html>
