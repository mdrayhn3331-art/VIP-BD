<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSM SHOP — Fashion Hub</title><link rel="stylesheet" href="css/style.css"><style>body{background:#070707;color:#fff;padding-bottom:90px}.wrap{max-width:1100px;margin:auto;padding:16px}.hero{padding:20px}.brand{color:#ffd34d;font-weight:1000;letter-spacing:2px}.cats{display:flex;gap:8px;overflow:auto;padding:15px 0}.cats button{white-space:nowrap;padding:11px 15px;border-radius:14px;border:1px solid #ffffff18;background:#111;color:#ddd}.cats button.active{border-color:#ffd34d;color:#ffd34d}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.product{overflow:hidden;border-radius:20px;background:#111;border:1px solid #ffffff14}.product img{width:100%;height:220px;object-fit:cover;background:#181818}.info{padding:14px}.badge{display:inline-block;padding:4px 8px;border-radius:8px;background:#e33;font-size:11px;font-weight:800}.price{font-size:23px;font-weight:1000;color:#ffd34d}.rating{color:#ffd34d;margin:6px 0}.meta{color:#aaa;font-size:12px;line-height:1.5}.actions{display:flex;gap:7px;margin-top:10px}.actions button{flex:1;padding:10px;border-radius:11px;border:1px solid #ffd34d55;background:#171717;color:#fff;font-weight:800}.actions button:last-child{background:linear-gradient(145deg,#ffd34d,#ff8a00);color:#080808}.bottom{position:fixed;z-index:9999;left:6px;right:6px;bottom:8px;display:flex;justify-content:space-around;padding:9px 3px;border-radius:22px;background:#151515f5;border:1px solid #ffffff22}.bottom a{color:#fff;text-decoration:none;text-align:center;flex:1}.bottom small{display:block;margin-top:3px;font-size:10px}@media(max-width:800px){.products{grid-template-columns:repeat(2,1fr)}.product img{height:180px}}@media(max-width:430px){.product img{height:145px}.actions{flex-direction:column}}</style></head><body><main class="wrap"><section class="hero glass"><div class="brand">👗 RSM FASHION HUB</div><h1>Fashion Collection</h1><div class="cats" id="cats"><button class="active" data-cat="all">All</button><button data-cat="saree">Saree</button><button data-cat="three-piece">3-Piece</button><button data-cat="clothes">General Clothes</button><button data-cat="pants">Pants</button><button data-cat="shirt">Shirts</button><button data-cat="tshirt">T-Shirts</button><button data-cat="genji">Genji</button><button data-cat="eyewear">Eyewear & Glasses</button><button data-cat="cosma">Cosma</button></div><div class="products" id="products">Loading products...</div></section></main><nav class="bottom"><a href="home.html">🏠<small>Home</small></a><a href="vip.html">👑<small>Premium</small></a><a href="fashion.html">👗<small>Fashion</small></a><a href="orders.html">📋<small>Orders</small></a><a href="profile.html">👤<small>Profile</small></a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script>const fallback='https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=700&q=80';let products=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const arr=v=>Array.isArray(v)?v:[];async function load(){try{const{data,error}=await supabaseClient.from('products').select('id,name,category,price,old_price,discount,rating,image_url,description,details,sizes,colors,stock').eq('is_active',true).order('created_at',{ascending:false});if(error)throw error;products=data||[];draw()}catch(e){document.getElementById('products').innerHTML='<p>Products load failed.</p>';console.error(e)}}function draw(cat='all'){const list=products.filter(p=>cat==='all'||String(p.category||'').toLowerCase()===cat);document.getElementById('products').innerHTML=list.map(p=>{const sizes=arr(p.sizes).join(', ')||'N/A',colors=arr(p.colors).join(', ')||'N/A';return `<article class="product"><img src="${esc(p.image_url||fallback)}" alt="${esc(p.name)}" onerror="this.onerror=null;this.src='${fallback}'"><div class="info"><span class="badge">-${esc(p.discount??0)}%</span><h3>${esc(p.name||'Product')}</h3><div class="rating">★ ${esc(p.rating??0)}</div><div class="price">৳${esc(p.price??0)}</div><div class="meta">📏 Size: ${esc(sizes)}<br>🎨 Color: ${esc(colors)}<br>📦 Stock: ${esc(p.stock??0)}</div><div class="actions"><button onclick="details('${esc(p.id)}')">View Details</button><button onclick="buyNow('${esc(p.id)}')">Buy Now</button></div></div></article>`}).join('')||'<p>No products in this category.</p>'}function details(id){if(!products.some(x=>x.id===id))return;location.href='product.html?id='+encodeURIComponent(id)}function buyNow(id){if(!products.some(x=>x.id===id))return;location.href='orders.html?buy='+encodeURIComponent(id)}document.querySelectorAll('#cats button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#cats button').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw(b.dataset.cat)});load();</script></body></html>
