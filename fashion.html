<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSM SHOP — Fashion Hub</title><link rel="stylesheet" href="css/style.css"><style>body{background:#070707;color:#fff;padding-bottom:90px}.wrap{max-width:1100px;margin:auto;padding:16px}.hero{padding:20px}.brand{color:#ffd34d;font-weight:1000;letter-spacing:2px}.cats{display:flex;gap:8px;overflow:auto;padding:15px 0}.cats button{white-space:nowrap;padding:11px 15px;border-radius:14px;border:1px solid #ffffff18;background:#111;color:#ddd}.cats button.active,.cats button:hover{border-color:#ffd34d;color:#ffd34d;box-shadow:0 0 18px #ffd34d22}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.product{overflow:hidden;border-radius:20px;background:#111;border:1px solid #ffffff14;box-shadow:0 12px 30px #000;transition:.2s}.product:hover{transform:translateY(-5px)}.product img{width:100%;height:220px;object-fit:cover}.info{padding:14px}.badge{display:inline-block;padding:4px 8px;border-radius:8px;background:#e33;color:#fff;font-size:11px;font-weight:800}.price{font-size:23px;font-weight:1000;color:#ffd34d}.old{text-decoration:line-through;color:#777;margin-left:7px;font-size:13px}.rating{color:#ffd34d;margin:6px 0}.actions{display:flex;gap:7px;margin-top:10px}.actions button{flex:1;padding:10px;border-radius:11px;border:1px solid #ffd34d55;background:#171717;color:#fff;font-weight:800}.actions button:last-child{background:linear-gradient(145deg,#ffd34d,#ff8a00);color:#080808}.bottom{position:fixed;z-index:9999;left:6px;right:6px;bottom:8px;display:flex;justify-content:space-around;padding:9px 3px;border-radius:22px;background:#151515f5;border:1px solid #ffffff22}.bottom a{color:#fff;text-decoration:none;text-align:center;flex:1}.bottom small{display:block;margin-top:3px;font-size:10px}@media(max-width:800px){.products{grid-template-columns:repeat(2,1fr)}.product img{height:180px}}@media(max-width:430px){.products{gap:9px}.product img{height:145px}.actions{flex-direction:column}}</style></head><body><main class="wrap"><section class="hero glass"><div class="brand">👗 RSM FASHION HUB</div><h1>Fashion Collection</h1><p>সব category এক জায়গায় — Saree থেকে Eyewear পর্যন্ত।</p><div class="cats" id="cats"><button class="active" data-cat="all">All</button><button data-cat="saree">Saree</button><button data-cat="three-piece">3-Piece</button><button data-cat="clothes">General Clothes</button><button data-cat="pants">Pants</button><button data-cat="shirt">Shirts</button><button data-cat="tshirt">T-Shirts</button><button data-cat="eyewear">Eyewear & Glasses</button></div><div class="products" id="products"></div></section></main><nav class="bottom"><a href="home.html">🏠<small>Home</small></a><a href="vip.html">👑<small>Premium</small></a><a href="fashion.html">👗<small>Fashion</small></a><a href="orders.html">📋<small>Orders</small></a><a href="profile.html">👤<small>Profile</small></a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script>const demo=[['saree','Premium Saree','1850','15','4.8','https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=700&q=80'],['three-piece','Elegant 3-Piece','1450','20','4.7','https://images.unsplash.com/photo-1583391733956-6c78276477e2?auto=format&fit=crop&w=700&q=80'],['clothes','Casual Outfit','850','10','4.6','https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=700&q=80'],['pants','Classic Pants','990','12','4.5','https://images.unsplash.com/photo-1473966968600-fa801b869a1a?auto=format&fit=crop&w=700&q=80'],['shirt','Formal Shirt','780','15','4.8','https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?auto=format&fit=crop&w=700&q=80'],['tshirt','Premium T-Shirt','590','18','4.7','https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=700&q=80'],['eyewear','Classic Glasses','650','25','4.9','https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=700&q=80']];let products=demo.map((x,i)=>({id:'demo-'+i,category:x[0],name:x[1],price:x[2],discount:x[3],rating:x[4],image_url:x[5]}));async function load(){try{const{data}=await supabaseClient.from('products').select('*').eq('is_active',true).order('created_at',{ascending:false});if(data?.length)products=data}catch(e){}}function draw(cat='all'){const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.getElementById('products').innerHTML=products.filter(p=>cat==='all'||String(p.category||'').toLowerCase()===cat).map(p=>`<article class="product"><img src="${esc(p.image_url||p.image)}" alt="${esc(p.name)}"><div class="info"><span class="badge">-${esc(p.discount??10)}%</span><h3>${esc(p.name||'Product')}</h3><div class="rating">★ ${esc(p.rating??'4.8')}</div><div class="price">৳${esc(String(p.price??0).replace(/^৳/,''))} <span class="old">৳${esc(p.old_price??'')}</span></div><div class="actions"><button onclick="addCart('${esc(p.id)}')">Add to Cart</button><button onclick="buyNow('${esc(p.id)}')">Buy Now</button></div></div></article>`).join('')||'<p>No products in this category.</p>'}function addCart(id){alert('Added to cart: '+id)}function buyNow(id){location.href='vip.html?product='+encodeURIComponent(id)}document.querySelectorAll('#cats button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#cats button').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw(b.dataset.cat)});load().finally(()=>draw());</script></body></html>
