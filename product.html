<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Details</title><link rel="stylesheet" href="css/style.css"><style>body{background:#070707;color:#fff}.wrap{max-width:900px;margin:auto;padding:18px}.card{padding:18px;border-radius:22px;background:#111;border:1px solid #ffffff18}.pic{width:100%;max-height:520px;object-fit:contain;border-radius:18px;background:#181818}.price{font-size:28px;color:#ffd34d;font-weight:900}.meta{color:#aaa;line-height:1.8}.btn{display:block;width:100%;box-sizing:border-box;padding:13px;margin-top:12px;border:0;border-radius:13px;background:linear-gradient(145deg,#ffd34d,#ff8a00);color:#111;font-weight:900;text-align:center;text-decoration:none}</style></head><body><main class="wrap"><a href="fashion.html" style="color:#ffd34d">← Products</a><section id="app" class="card" style="margin-top:14px">Loading...</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const a=v=>Array.isArray(v)?v.join(', '):'N/A';async function load(){const id=new URLSearchParams(location.search).get('id');if(!id){app.innerHTML='Product not found';return}const{data:p,error}=await supabaseClient.from('products').select('*').eq('id',id).eq('is_active',true).maybeSingle();if(error||!p){app.innerHTML='Product not found';return}app.innerHTML=`<img class="pic" src="${esc(p.image_url||'')}" onerror="this.style.display='none'"><h1>${esc(p.name)}</h1><div class="price">৳${esc(p.price)}</div><div class="meta">⭐ ${esc(p.rating||0)}<br>📏 Size: ${esc(a(p.sizes))}<br>🎨 Color: ${esc(a(p.colors))}<br>📦 Stock: ${esc(p.stock||0)}</div><p>${esc(p.details||p.description||'')}</p><a class="btn" href="checkout.html?product=${encodeURIComponent(p.id)}">Buy Now</a>`}load()</script></body></html>
