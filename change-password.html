<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Change — VIP SHOP BD</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/change-password.css"></head><body><main class="password-page"><section class="password-card"><div class="icon">🔐</div><h1>Password Change</h1><p class="muted">আপনার password নিরাপদ রাখতে বর্তমান password যাচাই করুন।</p><form id="passwordForm"><label>Old Password</label><div class="field"><input id="oldPassword" type="password" autocomplete="current-password" required><button type="button" onclick="toggle('oldPassword',this)">👁️</button></div><label>New Password</label><div class="field"><input id="newPassword" type="password" autocomplete="new-password" minlength="6" required><button type="button" onclick="toggle('newPassword',this)">👁️</button></div><label>Confirm New Password</label><div class="field"><input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required><button type="button" onclick="toggle('confirmPassword',this)">👁️</button></div><button class="change-btn" type="submit">🔐 Change Password</button><p id="msg"></p></form><button class="forgot-btn" onclick="forgotPassword()">🔄 Forgot Password?</button><a class="back" href="profile.html">← Back to Profile</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/change-password.js"></script><script src="js/navigation.js"></script></body></html>
