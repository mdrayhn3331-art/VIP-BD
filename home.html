<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIP SHOP BD</title><link rel="stylesheet" href="css/style.css"><style>body{margin:0;background:#080808;color:#fff}.home{max-width:900px;margin:auto;padding:18px 14px 40px}.search{display:flex;gap:10px;padding:10px;border:1px solid #ffffff22;border-radius:20px;background:#111d;box-shadow:0 10px 35px #000}.search input{width:100%;border:0;outline:0;border-radius:14px;padding:14px 16px;background:#ffffff10;color:#fff;font-size:16px}.search button{border:0;border-radius:14px;padding:0 18px;background:linear-gradient(145deg,#ffd84d,#ff8a00);font-weight:900}.slider{position:relative;margin-top:20px;overflow:hidden;border-radius:26px;box-shadow:0 15px 45px #000}.slides{display:flex;transition:transform .6s ease}.slide{min-width:100%;position:relative}.slide img{width:100%;height:300px;object-fit:cover;display:block}.caption{position:absolute;left:0;right:0;bottom:0;padding:20px 16px;background:linear-gradient(transparent,#000d);font-weight:900;font-size:18px;color:#ffd34d}.dots{position:absolute;bottom:10px;right:14px;display:flex;gap:7px}.dot{width:9px;height:9px;border:0;border-radius:50%;background:#fff8;padding:0}.dot.active{background:#ffd34d}.simple{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.pic{background:#111;padding:6px;border-radius:20px;box-shadow:0 10px 30px #0008}.simple img{width:100%;height:135px;object-fit:cover;border-radius:16px;display:block}.simple .caption{position:static;padding:8px 5px;font-size:15px}@media(max-width:650px){.slide img{height:220px}.simple{grid-template-columns:repeat(2,1fr)}.simple img{height:125px}}@media(max-width:420px){.search button{padding:0 13px}}</style></head><body><main class="home"><form class="search" onsubmit="return false"><input id="q" type="search" placeholder="🔎 Product search..." autocomplete="off"><button>Search</button></form><section class="slider"><div class="slides" id="slides"><div class="slide"><img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1200&q=85" alt="Shopping store"><div class="caption">🛍️ Premium Shopping</div></div><div class="slide"><img src="https://images.unsplash.com/photo-1498049794561-7780e7231661?auto=format&fit=crop&w=1200&q=85" alt="Electronics"><div class="caption">🎧 Electronics</div></div><div class="slide"><img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=1200&q=85" alt="Camera"><div class="caption">✨ Trending Products</div></div><div class="slide"><img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=1200&q=85" alt="Watch"><div class="caption">⌚ Accessories</div></div><div class="slide"><img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=1200&q=85" alt="Headphones"><div class="caption">🎧 Gadgets</div></div></div><div class="dots" id="dots"></div></section><section class="simple"><div class="pic"><img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=700&q=80" alt="Smartphone"><div class="caption">📱 Smartphone</div></div><div class="pic"><img src="https://images.unsplash.com/photo-1556228578-8c89e6adf883?auto=format&fit=crop&w=700&q=80" alt="Lifestyle"><div class="caption">🛍️ Lifestyle</div></div><div class="pic"><img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=700&q=80" alt="Shoes"><div class="caption">👟 Shoes</div></div><div class="pic"><img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=700&q=80" alt="Fashion"><div class="caption">👕 Fashion</div></div></section></main><script>const q=document.getElementById('q'),cards=[...document.querySelectorAll('.simple .pic')];q.oninput=()=>{const t=q.value.trim().toLowerCase();cards.forEach(c=>c.style.display=!t||c.textContent.toLowerCase().includes(t)?'block':'none')};const slides=document.getElementById('slides'),dots=document.getElementById('dots');let i=0;for(let n=0;n<5;n++){const b=document.createElement('button');b.className='dot'+(n?'':' active');b.onclick=()=>go(n);dots.appendChild(b)}function go(n){i=(n+5)%5;slides.style.transform='translateX(-'+i*100+'%)';[...dots.children].forEach((d,k)=>d.classList.toggle('active',k===i))}setInterval(()=>go(i+1),4000);</script></body></html>
