<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIP SHOP BD</title><link rel="stylesheet" href="css/style.css"><style>body{margin:0;background:#080808;color:#fff}.home{max-width:900px;margin:auto;padding:18px 14px 40px}.search{position:sticky;top:10px;z-index:5;display:flex;gap:10px;padding:10px;border:1px solid #ffffff22;border-radius:20px;background:#111d;backdrop-filter:blur(14px);box-shadow:0 10px 35px #000}.search input{width:100%;border:0;outline:0;border-radius:14px;padding:14px 16px;background:#ffffff10;color:#fff;font-size:16px}.search button{border:0;border-radius:14px;padding:0 18px;background:linear-gradient(145deg,#ffd84d,#ff8a00);font-weight:900}.top{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:20px}.top img{width:100%;height:220px;object-fit:cover;border-radius:22px;display:block}.top .big{height:310px}.simple{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.simple img{width:100%;height:145px;object-fit:cover;border-radius:18px}.pic{background:#111;padding:6px;border-radius:24px;box-shadow:0 10px 30px #0008}.caption{padding:8px 5px;font-weight:700;color:#ffd34d}@media(max-width:650px){.top{grid-template-columns:1fr}.top .big{height:230px}.top img{height:170px}.simple{grid-template-columns:repeat(2,1fr)}.simple img{height:125px}}@media(max-width:420px){.simple{grid-template-columns:1fr 1fr}.search button{padding:0 13px}}</style></head><body><main class="home"><form class="search" onsubmit="return false"><input id="q" type="search" placeholder="🔎 Product search..." autocomplete="off"><button type="submit">Search</button></form><section class="top"><div class="pic"><img class="big" src="https://ibazarbd.com/storage/exclusive-deals.png" alt="Shopping deals"><div class="caption">🛍️ Premium Shopping</div></div><div class="pic"><img src="https://smartkartapp.com/uploads/electronics1.png" alt="Electronics shopping"><div class="caption">🎧 Electronics</div></div><div class="pic"><img src="https://eghuri.com/public/uploads/banner/1747296504assetstask_01jv9ez9xgecgt0th15ps%20%281%29.jpg" alt="Online shopping"><div class="caption">✨ Trending</div></div></section><section class="simple"><div class="pic"><img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=700&q=80" alt="Watch"><div class="caption">⌚ Watch</div></div><div class="pic"><img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=700&q=80" alt="Headphones"><div class="caption">🎧 Headphones</div></div><div class="pic"><img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=700&q=80" alt="Smartphone"><div class="caption">📱 Smartphone</div></div><div class="pic"><img src="https://images.unsplash.com/photo-1556228578-8c89e6adf883?auto=format&fit=crop&w=700&q=80" alt="Lifestyle"><div class="caption">🛍️ Lifestyle</div></div></section></main><script>const q=document.getElementById('q');q.addEventListener('input',()=>{const term=q.value.trim().toLowerCase();document.querySelectorAll('.pic').forEach(card=>{card.style.display=!term||card.textContent.toLowerCase().includes(term)?'block':'none'})})</script></body></html>
