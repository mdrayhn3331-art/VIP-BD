<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSM SHOP — Home</title><link rel="stylesheet" href="css/style.css"><style>body{margin:0;background:#070707;color:#fff;padding-bottom:90px}.home{max-width:1100px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.brand{font-size:24px;font-weight:1000;letter-spacing:2px}.brand span:nth-child(1){color:#ff315f}.brand span:nth-child(2){color:#24d9ff}.brand span:nth-child(3){color:#b86cff}.search{display:flex;gap:8px;padding:8px;border:1px solid #ffffff18;border-radius:18px;background:#111c}.search input{flex:1;min-width:0;border:0;outline:0;border-radius:13px;padding:13px;background:#ffffff0d;color:#fff}.search button{border:0;border-radius:13px;padding:0 18px;background:linear-gradient(145deg,#ffd84d,#ff8a00);font-weight:900}.slider{position:relative;overflow:hidden;border-radius:24px;border:1px solid #ffffff15;box-shadow:0 15px 50px #000}.slides{display:flex;transition:transform .65s}.slide{min-width:100%;position:relative;background:#111}.slide img,.slide video{display:block;width:100%;height:390px;object-fit:cover}.slide video{pointer-events:none}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#000a 0%,transparent 55%,#0002)}.caption{position:absolute;left:0;right:0;bottom:0;padding:55px 22px 18px;background:linear-gradient(transparent,#000e);font-size:22px;font-weight:1000;color:#ffd34d}.video-tag{position:absolute;top:14px;left:14px;padding:7px 11px;border-radius:12px;background:#0009;border:1px solid #ffd34d55;color:#ffd34d;font-size:11px;font-weight:900;backdrop-filter:blur(8px)}.dots{position:absolute;right:16px;bottom:14px;display:flex;gap:6px}.dot{width:8px;height:8px;padding:0;border:0;border-radius:50%;background:#fff5}.dot.active{background:#ffd34d}.desc{margin-top:18px;padding:20px;border-radius:20px;border:1px solid #ffffff15;background:#101010}.desc h2{margin:0 0 7px;color:#ffd34d}.desc p{margin:0;color:#bbb;line-height:1.6}.section-title{display:flex;justify-content:space-between;margin:24px 2px 12px}.section-title h2{margin:0}.section-title span{color:#ffd34d;font-size:12px}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{overflow:hidden;border-radius:18px;background:#111;border:1px solid #ffffff12}.card img{width:100%;height:180px;object-fit:cover;background:#181818}.card div{padding:12px}.card b{display:block}.price{color:#ffd34d;font-size:19px;font-weight:900;margin-top:6px}.btn{display:block;margin-top:8px;width:100%;padding:10px;border-radius:11px;border:1px solid #ffd34d55;background:linear-gradient(145deg,#ffd34d,#ff8a00);font-weight:900;text-decoration:none;color:#080808;text-align:center;box-sizing:border-box}.bottom{position:fixed;z-index:9999;left:6px;right:6px;bottom:8px;display:flex;justify-content:space-around;padding:9px 3px;border-radius:22px;background:#151515f5;border:1px solid #ffffff22}.bottom a{color:#fff;text-decoration:none;text-align:center;flex:1}.bottom small{display:block;margin-top:3px;font-size:10px}@media(max-width:700px){.slide img,.slide video{height:230px}.products{grid-template-columns:repeat(2,1fr)}.card img{height:150px}}@media(max-width:430px){.brand{font-size:19px}.search button{padding:0 12px}}</style></head><body><main class="home"><div class="top"><div class="brand"><span>R</span><span>S</span><span>M</span> SHOP</div></div><form id="searchForm" class="search"><input id="q" type="search" placeholder="🔎 Search products, deals..."><button>Search</button></form><section class="slider"><div class="slides" id="slides"></div><div class="dots" id="dots"></div></section><section class="desc"><h2>RSM SHOP</h2><p>Premium digital products, fashion and trending deals—সবকিছু এক জায়গায়।</p></section><div class="section-title"><h2>🔥 Featured Products</h2><span>LIVE FROM SUPABASE</span></div><section class="products" id="products"><p>Loading products...</p></section></main><nav class="bottom"><a href="home.html">🏠<small>Home</small></a><a href="vip.html">👑<small>Premium</small></a><a href="fashion.html">🛍️<small>Products</small></a><a href="orders.html">📋<small>Orders</small></a><a href="profile.html">👤<small>Profile</small></a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script>let i=0,banners=[];const fallback='https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1400&q=85';const videoFallback=[{video_url:'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',title:'🌸 RSM Premium Collection'},{video_url:'https://media.w3.org/2010/05/sintel/trailer.mp4',title:'✨ RSM Featured Promotion'}];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function loadBanners(){const{data}=await supabaseClient.from('banners').select('*').eq('is_active',true).order('position',{ascending:true});banners=(data||[]).filter(x=>x.image_url||x.video_url);if(!banners.length)banners=videoFallback;document.getElementById('slides').innerHTML=banners.map((b,n)=>{const isVideo=!!b.video_url;return `<div class="slide">${b.link_url?`<a href="${esc(b.link_url)}" target="_self">`:''}${isVideo?`<video src="${esc(b.video_url)}" autoplay muted loop playsinline preload="metadata"></video><span class="video-tag">▶ VIDEO PROMO</span>`:`<img src="${esc(b.image_url||fallback)}" onerror="this.onerror=null;this.src='${fallback}'>`}<div class="shade"></div><div class="caption">${esc(b.title||'RSM SHOP')}</div>${b.link_url?'</a>':''}</div>`}).join('');document.getElementById('dots').innerHTML=banners.map((_,n)=>`<button class="dot${n?'':' active'}" onclick="go(${n})"></button>`).join('')}function go(n){i=(n+banners.length)%banners.length;document.getElementById('slides').style.transform='translateX(-'+i*100+'%)';[...document.getElementById('dots').children].forEach((d,k)=>d.classList.toggle('active',k===i));document.querySelectorAll('.slide video').forEach(v=>v.pause());const v=document.querySelectorAll('.slide')[i]?.querySelector('video');if(v){v.currentTime=0;v.play().catch(()=>{})}}async function loadProducts(q=''){const{data,error}=await supabaseClient.from('products').select('id,name,category,price,discount,rating,image_url,description').eq('is_active',true).order('created_at',{ascending:false}).limit(12);const box=document.getElementById('products');if(error){box.innerHTML='<p>Products load failed.</p>';return}const rows=(data||[]).filter(p=>!q||String(p.name+' '+p.category).toLowerCase().includes(q.toLowerCase()));box.innerHTML=rows.map(p=>`<article class="card"><img src="${esc(p.image_url||fallback)}" onerror="this.onerror=null;this.src='${fallback}'"><div><b>${esc(p.name)}</b><small>${esc(p.category)} · ⭐${esc(p.rating??0)}</small><div class="price">৳${esc(p.price??0)}</div><a class="btn" href="product.html?id=${encodeURIComponent(p.id)}">View Product</a></div></article>`).join('')||'<p>No products found.</p>'}document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();loadProducts(document.getElementById('q').value.trim())};loadBanners();loadProducts();setInterval(()=>banners.length>1&&go(i+1),5000);</script></body></html>
