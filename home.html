<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIP SHOP BD</title><link rel="stylesheet" href="css/style.css"><style>body{margin:0;background:#080808;color:#fff;padding-bottom:90px}.home{max-width:900px;margin:auto;padding:18px 14px 40px}.search{display:flex;gap:10px;padding:10px;border:1px solid #ffffff22;border-radius:20px;background:#111d;box-shadow:0 10px 35px #000}.search input{width:100%;border:0;outline:0;border-radius:14px;padding:14px 16px;background:#ffffff10;color:#fff;font-size:16px}.search button{border:0;border-radius:14px;padding:0 16px;background:linear-gradient(145deg,#ffd84d,#ff8a00);font-weight:900}.slider{position:relative;margin-top:8px;overflow:hidden;border-radius:26px}.slides{display:flex;transition:transform .6s ease}.slide{min-width:100%;position:relative}.slide img{width:100%;height:300px;object-fit:cover;display:block}.caption{position:absolute;left:0;right:0;bottom:0;padding:20px 16px;background:linear-gradient(transparent,#000d);font-weight:900;color:#ffd34d}.dots{position:absolute;bottom:10px;right:14px;display:flex;gap:7px}.dot{width:9px;height:9px;border:0;border-radius:50%;background:#fff8;padding:0}.dot.active{background:#ffd34d}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.quick a,.admin-entry{display:block;text-align:center;border-radius:14px;padding:12px 8px;background:linear-gradient(145deg,#ffd84d,#ff8a00);font-weight:900;color:#160e00;text-decoration:none;box-shadow:0 6px 0 #7b4100}.admin-entry{display:none;margin-top:14px;background:linear-gradient(145deg,#b96cff,#5b16a8);color:#fff;box-shadow:0 6px 0 #351064}.simple{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.pic{display:block;background:#111;padding:6px;border-radius:20px;text-decoration:none;color:#fff;cursor:pointer;transition:.2s}.pic:hover{transform:translateY(-4px);box-shadow:0 12px 30px #ff9d0044}.simple img{width:100%;height:135px;object-fit:cover;border-radius:16px;display:block}.simple .caption{position:static;padding:8px 5px;font-size:15px;background:none}@media(max-width:650px){.slide img{height:220px}.quick{grid-template-columns:repeat(2,1fr)}}@media(max-width:380px){.bottom a{font-size:11px}.bottom small{font-size:9px}.search button{padding:0 12px}}@media(min-width:700px){.simple{grid-template-columns:repeat(4,1fr)}}.bottom{position:fixed;z-index:9999;left:6px;right:6px;bottom:8px;display:flex;justify-content:space-around;gap:2px;padding:9px 3px;border-radius:22px;background:#151515f5;border:1px solid #ffffff22}.bottom a{color:#fff;text-decoration:none;text-align:center;flex:1;font-size:12px}.bottom small{display:block;margin-top:3px;font-size:10px}</style></head><body><main class="home"><form id="searchForm" class="search"><input id="q" type="search" placeholder="🔎 Product search..." autocomplete="off"><button type="submit">Search</button></form><section class="slider"><div class="slides" id="slides"><div class="slide"><img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1200&q=85" alt="Shopping"><div class="caption">🛍️ Premium Shopping</div></div><div class="slide"><img src="https://images.unsplash.com/photo-1498049794561-7780e7231661?auto=format&fit=crop&w=1200&q=85" alt="Electronics"><div class="caption">🎧 Electronics</div></div><div class="slide"><img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99e?auto=format&fit=crop&w=1200&q=85" alt="Camera"><div class="caption">✨ Trending Products</div></div><div class="slide"><img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=1200&q=85" alt="Watch"><div class="caption">⌚ Accessories</div></div><div class="slide"><img src="https://images.unsplash.com/photo-1505740420928-5e5740420928-5e560c06d30e?auto=format&fit=crop&w=1200&q=85" alt="Headphones"><div class="caption">🎧 Gadgets</div></div></div><div class="dots" id="dots"></div></section><section class="quick"><a href="vip.html">👑<br>VIP Plans</a><a href="orders.html">🛍️<br>Products</a><a href="deposit.html">💰<br>Deposit</a><a href="balance.html">💳<br>Balance</a><a href="profile.html">👤<br>Profile</a><a href="cart.html">🛒<br>Cart</a></section><a id="adminEntry" class="admin-entry" href="admin/index.html">⚙️ Admin Panel</a><section class="simple" id="productGrid"><a class="pic" href="orders.html?category=smartphone"><img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=700&q=80" alt="Smartphone"><div class="caption">📱 Smartphone</div></a><a class="pic" href="orders.html?category=lifestyle"><img src="https://images.unsplash.com/photo-1556228578-8c89e6adf883?auto=format&fit=crop&w=700&q=80" alt="Lifestyle"><div class="caption">🛍️ Lifestyle</div></a><a class="pic" href="orders.html?category=shoes"><img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=700&q=80" alt="Shoes"><div class="caption">👟 Shoes</div></a><a class="pic" href="orders.html?category=fashion"><img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=700&q=80" alt="Fashion"><div class="caption">👕 Fashion</div></a></section></main><nav class="bottom"><a href="home.html">🏠<small>Home</small></a><a href="orders.html">🛍️<small>Products</small></a><a href="balance.html">💳<small>Balance</small></a><a href="orders.html#history">📋<small>Orders</small></a><a href="profile.html">👤<small>Profile</small></a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script>const form=document.getElementById('searchForm'),q=document.getElementById('q');form.addEventListener('submit',e=>{e.preventDefault();const t=q.value.trim();location.href='orders.html'+(t?'?search='+encodeURIComponent(t):'')});const slides=document.getElementById('slides'),dots=document.getElementById('dots');let i=0;for(let n=0;n<5;n++){const b=document.createElement('button');b.className='dot'+(n?'':' active');b.type='button';b.onclick=()=>go(n);dots.appendChild(b)}function go(n){i=(n+5)%5;slides.style.transform='translateX(-'+i*100+'%)';[...dots.children].forEach((d,k)=>d.classList.toggle('active',k===i))}setInterval(()=>go(i+1),4000);async function showAdmin(){try{const{data:{user}}=await supabaseClient.auth.getUser();if(!user)return;const{data:p}=await supabaseClient.from('profiles').select('role').eq('id',user.id).maybeSingle();if(p?.role==='admin')document.getElementById('adminEntry').style.display='block'}catch(e){console.warn(e)}}showAdmin();</script></body></html>
