<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders & Shopping — VIP SHOP BD</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/3d.css"></head><body><header class="nav glass"><b>🛍️ VIP SHOP BD</b><a href="home.html">🏠 Home</a></header><main><section class="glass hero"><div class="tag">🛒 SHOP + ORDER HISTORY</div><h1>আমার Orders</h1><p>Buy করার আগে Balance tap করে confirm করতে হবে।</p><div class="price">৳<span id="balance">0</span></div><button class="btn" onclick="refreshBalance()">💳 Balance Refresh</button></section><section><h2>🛍️ Products</h2><div id="products" class="grid">লোড হচ্ছে...</div></section><section class="glass panel"><h2>📋 Order History</h2><div id="orders">লোড হচ্ছে...</div></section></main><nav class="mobile-nav glass"><a href="home.html">🏠<small>হোম</small></a><a href="vip.html" class="active">🛍️<small>প্রোডাক্ট</small></a><a href="profile.html">👤<small>প্রোফাইল</small></a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script>let user=null;function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function init(){const r=await supabaseClient.auth.getUser();user=r.data.user;if(!user){location.href='index.html';return}await refreshBalance();await loadProducts();await loadOrders()}async function refreshBalance(){if(!user){const r=await supabaseClient.auth.getUser();user=r.data.user}if(!user)return;const{data}=await supabaseClient.from('wallets').select('balance').eq('user_id',user.id).maybeSingle();document.getElementById('balance').textContent=Number(data?.balance||0).toLocaleString('en-BD')}async function loadProducts(){const el=document.getElementById('products');const{data,error}=await supabaseClient.from('products').select('*').eq('is_active',true).order('created_at',{ascending:false});if(error){el.textContent=error.message;return}el.innerHTML=(data||[]).map(p=>`<article class="glass card"><img src="${esc(p.image_url||'')}" alt="${esc(p.name)}" style="width:100%;height:170px;object-fit:cover;border-radius:16px"><h3>${esc(p.name)}</h3><div class="price">৳${Number(p.price||0).toLocaleString('en-BD')}</div><p>${esc(p.description||'')}</p><button class="btn" onclick="buy('${p.id}',${Number(p.price||0)})">💳 Balance → Buy Now</button></article>`).join('')||'<div class="glass card">কোনো active product নেই।</div>'}async function buy(id,price){await refreshBalance();const balance=Number(document.getElementById('balance').textContent.replace(/[^0-9.-]/g,''))||0;if(balance<price){if(confirm('Balance পর্যাপ্ত নয়। Deposit page-এ যেতে চান?'))location.href='home.html#deposit';return}if(!confirm(`Balance: ৳${balance.toLocaleString('en-BD')}\nProduct price: ৳${price.toLocaleString('en-BD')}\n\nআপনি Balance থেকে টাকা কেটে Order করতে চান?`))return;const{data,error}=await supabaseClient.rpc('purchase_product',{p_product_id:id,p_quantity:1});if(error){alert(error.message.includes('Insufficient balance')?'❌ Balance পর্যাপ্ত নয়।':'❌ Order করা যায়নি: '+error.message);await refreshBalance();return}alert(`✅ Order তৈরি হয়েছে।\nOrder ID: ${data.order_id}\nকাটা হয়েছে: ৳${Number(data.amount).toLocaleString('en-BD')}`);await refreshBalance();await loadOrders()}async function loadOrders(){const el=document.getElementById('orders');const{data,error}=await supabaseClient.from('orders').select('id,total_amount,status,created_at').eq('user_id',user.id).order('created_at',{ascending:false});if(error){el.textContent=error.message;return}el.innerHTML=(data||[]).map(o=>`<article class="glass card"><b>Order #${esc(o.id)}</b><p>৳${Number(o.total_amount||0).toLocaleString('en-BD')}</p><p>Status: ${esc(o.status||'pending')}</p><small>${new Date(o.created_at).toLocaleString('bn-BD')}</small></article>`).join('')||'এখনও কোনো order নেই।'}init()</script></body></html>
