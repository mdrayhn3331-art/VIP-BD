<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSM SHOP — My Orders</title><link rel="stylesheet" href="css/style.css"><style>body{background:#070707;color:#fff;padding-bottom:90px}.wrap{max-width:1000px;margin:auto;padding:16px}.head{padding:20px}.head h1{margin:5px 0}.muted{color:#999}.orders{display:grid;gap:14px;margin-top:16px}.order{padding:18px;border-radius:22px;background:linear-gradient(145deg,#171717,#0b0b0b);border:1px solid #ffffff15;box-shadow:0 15px 40px #000}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #ffffff10;padding-bottom:12px}.oid{font-weight:1000;color:#ffd34d}.date{color:#888;font-size:12px}.details{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin-top:14px}.label{display:block;color:#777;font-size:11px;margin-bottom:5px;text-transform:uppercase;letter-spacing:1px}.value{font-weight:800}.badge{display:inline-block;padding:6px 10px;border-radius:10px;font-size:11px;font-weight:900}.pending{background:#5b4300;color:#ffd34d}.verified{background:#063d2b;color:#5cffb0}.processing{background:#102c55;color:#62b4ff}.delivered{background:#063d2b;color:#5cffb0}.empty{text-align:center;padding:40px;color:#888}.bottom{position:fixed;z-index:9999;left:6px;right:6px;bottom:8px;display:flex;justify-content:space-around;padding:9px 3px;border-radius:22px;background:#151515f5;border:1px solid #ffffff22}.bottom a{color:#fff;text-decoration:none;text-align:center;flex:1}.bottom small{display:block;margin-top:3px;font-size:10px}@media(max-width:650px){.details{grid-template-columns:1fr 1fr}.details .item{grid-column:1/-1}}</style></head><body><main class="wrap"><section class="head glass"><div style="color:#ffd34d;font-weight:900;letter-spacing:2px">📋 RSM ORDER CENTER</div><h1>My Orders</h1><p class="muted">আপনার সব active ও past order-এর payment এবং delivery status এখানে দেখুন।</p></section><section id="orders" class="orders"><div class="order glass">Loading orders...</div></section></main><nav class="bottom"><a href="home.html">🏠<small>Home</small></a><a href="vip.html">👑<small>Premium</small></a><a href="fashion.html">👗<small>Fashion</small></a><a href="orders.html">📋<small>Orders</small></a><a href="profile.html">👤<small>Profile</small></a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script>async function init(){const el=document.getElementById('orders');const{data:{user}}=await supabaseClient.auth.getUser();if(!user){location.href='index.html';return}const{data,error}=await supabaseClient.from('orders').select('*').eq('user_id',user.id).order('created_at',{ascending:false});if(error){el.innerHTML='<div class="order glass">❌ Unable to load orders.</div>';return}el.innerHTML=(data||[]).map(o=>{const pay=['verified','paid','approved'].includes(String(o.payment_status||'').toLowerCase())?'verified':'pending';const delivery=['delivered','completed'].includes(String(o.delivery_status||o.status||'').toLowerCase())?'delivered':'processing';const date=o.created_at?new Date(o.created_at).toLocaleString('en-BD'):'—';const item=o.item_name||o.product_name||o.title||o.description||'Order item';const oid=String(o.id);return `<article class="order glass"><div class="top"><div><div class="oid">ORDER #${oid.slice(0,12)}</div><div class="date">${date}</div></div><span class="badge ${delivery}">${delivery==='delivered'?'Delivered':'Processing'}</span></div><div class="details"><div class="item"><span class="label">Item Details</span><div class="value">${String(item)}</div></div><div><span class="label">Payment</span><span class="badge ${pay}">${pay==='verified'?'Verified':'Pending'}</span></div><div><span class="label">Delivery</span><span class="badge ${delivery}">${delivery==='delivered'?'Delivered':'Processing'}</span></div></div></article>`}).join('')||'<div class="order glass empty">📦 No orders yet.</div>'}init()</script></body></html>
