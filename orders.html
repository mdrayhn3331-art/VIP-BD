<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSM SHOP — My Orders</title><link rel="stylesheet" href="css/style.css"><style>body{background:#070707;color:#fff;padding-bottom:90px}.wrap{max-width:1000px;margin:auto;padding:16px}.head,.checkout,.order{padding:20px;border-radius:22px;background:linear-gradient(145deg,#171717,#0b0b0b);border:1px solid #ffffff15;box-shadow:0 15px 40px #000}.muted{color:#999}.form{display:grid;gap:10px;margin-top:12px}.form input,.form textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:11px;background:#0d0d0d;color:#fff;border:1px solid #ffffff18}.btn{padding:12px 16px;border:0;border-radius:12px;background:linear-gradient(145deg,#ffd34d,#ff8a00);font-weight:900}.orders{display:grid;gap:14px;margin-top:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #ffffff10;padding-bottom:12px}.oid{font-weight:1000;color:#ffd34d}.date{color:#888;font-size:12px}.details{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin-top:14px}.label{display:block;color:#777;font-size:11px;margin-bottom:5px;text-transform:uppercase;letter-spacing:1px}.value{font-weight:800}.badge{display:inline-block;padding:6px 10px;border-radius:10px;font-size:11px;font-weight:900}.pending{background:#5b4300;color:#ffd34d}.verified{background:#063d2b;color:#5cffb0}.processing{background:#102c55;color:#62b4ff}.delivered{background:#063d2b;color:#5cffb0}.empty{text-align:center;padding:40px;color:#888}.bottom{position:fixed;z-index:9999;left:6px;right:6px;bottom:8px;display:flex;justify-content:space-around;padding:9px 3px;border-radius:22px;background:#151515f5;border:1px solid #ffffff22}.bottom a{color:#fff;text-decoration:none;text-align:center;flex:1}.bottom small{display:block;margin-top:3px;font-size:10px}@media(max-width:650px){.details{grid-template-columns:1fr 1fr}.details .item{grid-column:1/-1}}</style></head><body><main class="wrap"><section class="head"><div style="color:#ffd34d;font-weight:900;letter-spacing:2px">📋 RSM ORDER CENTER</div><h1>My Orders</h1><p class="muted">আপনার সব active ও past order এখানে দেখুন।</p></section><section id="checkout" class="checkout" style="display:none;margin-top:16px"><h2>🛒 Checkout</h2><div id="selected"></div><form id="checkoutForm" class="form"><input id="phone" placeholder="Phone Number" required><textarea id="address" placeholder="Delivery Address" required></textarea><input id="qty" type="number" min="1" value="1" required><button class="btn">Place Order</button><p id="msg"></p></form></section><section id="orders" class="orders"><div class="order">Loading orders...</div></section></main><nav class="bottom"><a href="home.html">🏠<small>Home</small></a><a href="vip.html">👑<small>Premium</small></a><a href="fashion.html">👗<small>Fashion</small></a><a href="orders.html">📋<small>Orders</small></a><a href="profile.html">👤<small>Profile</small></a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script>let selected=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){const{data:{user}}=await supabaseClient.auth.getUser();if(!user){location.href='index.html';return}const params=new URLSearchParams(location.search),buy=params.get('buy');if(buy){const{data:p}=await supabaseClient.from('products').select('*').eq('id',buy).eq('is_active',true).maybeSingle();if(p){selected=p;document.getElementById('checkout').style.display='block';document.getElementById('selected').innerHTML=`<b>${esc(p.name)}</b><br>৳${esc(p.price)} · Stock: ${esc(p.stock??0)}`}}loadOrders(user.id)}async function loadOrders(uid){const el=document.getElementById('orders');const{data,error}=await supabaseClient.from('orders').select('*').eq('user_id',uid).order('created_at',{ascending:false});if(error){el.innerHTML='<div class="order">❌ Unable to load orders: '+esc(error.message)+'</div>';return}el.innerHTML=(data||[]).map(o=>{const pay=['verified','paid','approved'].includes(String(o.payment_status||'').toLowerCase())?'verified':'pending';const delivery=['delivered','completed'].includes(String(o.delivery_status||o.status||'').toLowerCase())?'delivered':'processing';return `<article class="order"><div class="top"><div><div class="oid">ORDER #${esc(String(o.id).slice(0,12))}</div><div class="date">${o.created_at?new Date(o.created_at).toLocaleString('en-BD'):'—'}</div></div><span class="badge ${delivery}">${delivery==='delivered'?'Delivered':'Processing'}</span></div><div class="details"><div><span class="label">Item Details</span><div class="value">${esc(o.item_name||o.product_name||o.title||o.description||'Order item')}</div></div><div><span class="label">Payment</span><span class="badge ${pay}">${pay==='verified'?'Verified':'Pending'}</span></div><div><span class="label">Delivery</span><span class="badge ${delivery}">${delivery==='delivered'?'Delivered':'Processing'}</span></div></div></article>`}).join('')||'<div class="order empty">📦 No orders yet.</div>'}document.getElementById('checkoutForm').onsubmit=async e=>{e.preventDefault();if(!selected)return;const{data:{user}}=await supabaseClient.auth.getUser();if(!user)return;const qty=Math.max(1,Number(document.getElementById('qty').value||1));if(selected.stock<qty){document.getElementById('msg').textContent='❌ Stock not available.';return}const total=Number(selected.price)*qty;const payload={user_id:user.id,item_name:selected.name,product_name:selected.name,title:selected.name,description:selected.description||selected.details||'',quantity:qty,total_amount:total,phone:document.getElementById('phone').value.trim(),address:document.getElementById('address').value.trim(),payment_status:'pending',delivery_status:'processing',status:'pending'};const{error}=await supabaseClient.from('orders').insert(payload);if(error){document.getElementById('msg').textContent='❌ Order failed: '+error.message;return}document.getElementById('msg').textContent='✅ Order placed successfully!';document.getElementById('checkoutForm').reset();document.getElementById('checkout').style.display='none';history.replaceState({},'',location.pathname);loadOrders(user.id)}init();</script></body></html>
