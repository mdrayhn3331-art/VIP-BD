<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products — VIP SHOP BD</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/3d.css"><style>main{padding-bottom:90px}.products-title{text-align:center;margin:18px 0 24px}.product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.product-grid .card{overflow:hidden}.product-grid img{width:100%;height:160px;object-fit:cover;border-radius:16px;display:block}.product-grid .btn{display:block;width:100%;box-sizing:border-box;text-align:center}@media(min-width:700px){.product-grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:380px){.product-grid{grid-template-columns:1fr}}</style></head><body><main><h1 class="products-title">🛍️ Products</h1><section><div id="products" class="grid product-grid"><div class="glass card">লোড হচ্ছে...</div></div></section></main><nav class="mobile-nav glass"><a href="home.html">🏠<small>হোম</small></a><a href="orders.html" class="active">🛍️<small>প্রোডাক্ট</small></a><a href="profile.html">👤<small>প্রোফাইল</small></a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script>function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function init(){const r=await supabaseClient.auth.getUser();if(!r.data.user){location.href='index.html';return}const el=document.getElementById('products');const{data,error}=await supabaseClient.from('products').select('*').eq('is_active',true).order('created_at',{ascending:false});if(error){el.innerHTML='<div class="glass card">❌ '+esc(error.message)+'</div>';return}el.innerHTML=(data||[]).map(p=>`<article class="glass card"><img src="${esc(p.image_url||'')}" alt="${esc(p.name)}"><h3>${esc(p.name)}</h3><div class="price">৳${Number(p.price||0).toLocaleString('en-BD')}</div><p>${esc(p.description||'')}</p><a class="btn" href="product.html?id=${encodeURIComponent(p.id)}">View Product</a></article>`).join('')||'<div class="glass card">কোনো active product নেই।</div>'}init()</script></body></html>
