<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSM SHOP Orders</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/3d.css"></head><body><main><h1 class="products-title">📋 RSM SHOP Orders</h1><section class="glass card"><h2>Active & Past Orders</h2><div id="orders"><p>Loading orders...</p></div></section></main><nav class="mobile-nav glass"><a href="home.html">🏠<small>Home</small></a><a href="vip.html">👑<small>Premium App</small></a><a href="fashion.html">👕<small>Fashion</small></a><a href="orders.html" class="active">📋<small>Orders</small></a><a href="profile.html">👤<small>Profile</small></a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script>async function init(){const{data:{user}}=await supabaseClient.auth.getUser();if(!user){location.href='index.html';return}const el=document.getElementById('orders');const{data,error}=await supabaseClient.from('orders').select('*').eq('user_id',user.id).order('created_at',{ascending:false});if(error){el.innerHTML='<p>Unable to load orders.</p>';return}el.innerHTML=(data||[]).map(o=>`<article class="glass card"><b>Order #${String(o.id).slice(0,8)}</b><p>Status: <strong>${o.status||'Pending'}</strong></p><p>৳${Number(o.total||o.amount||0).toLocaleString('en-BD')}</p></article>`).join('')||'<p>No orders yet.</p>'}init()</script></body></html>
